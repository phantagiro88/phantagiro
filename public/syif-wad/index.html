<style>
:root{--ink:#14262b;--teal:#2a9d8f;--mint:#d7efe9;--gold:#f4b942;--red:#e63946;--paper:#fffdf6;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
html,body{margin:0;height:100%;background:var(--ink);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:#bfe3dc;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.hud{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--paper);border-bottom:3px solid var(--ink);flex:0 0 auto}
.chip{border:3px solid var(--ink);border-radius:12px;background:#fff;padding:3px 9px;font-weight:800;font-size:14px;white-space:nowrap;box-shadow:0 3px 0 var(--ink)}
.stress{flex:1;min-width:70px}
.stress .lbl{font-size:10px;font-weight:800;letter-spacing:.05em}
.bar{height:14px;border:3px solid var(--ink);border-radius:10px;background:#fff;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2a9d8f,#f4b942,#e63946);background-size:600% 100%;transition:width .2s}
.ibtn{border:3px solid var(--ink);border-radius:12px;background:var(--gold);min-width:42px;height:38px;padding:0 6px;white-space:nowrap;font-size:18px;box-shadow:0 3px 0 var(--ink)}
.ibtn:active{transform:translateY(3px);box-shadow:none}
.ibtn:disabled{background:#ccc;opacity:.6}
.ward{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:10px;padding:10px;
 background:repeating-linear-gradient(0deg,rgba(255,255,255,.18) 0 2px,transparent 2px 64px),repeating-linear-gradient(90deg,rgba(255,255,255,.18) 0 2px,transparent 2px 64px),#bfe3dc}
@media (orientation:portrait){.ward{grid-template-columns:repeat(2,1fr)}}
.bed{position:relative;border:3px solid var(--ink);border-radius:16px;background:#f3fbf9;box-shadow:0 4px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;min-height:0}
.bed::after{content:"";position:absolute;left:0;right:0;bottom:0;height:34%;background:linear-gradient(#6ec3b8,#4aa89c);border-top:3px solid var(--ink)}
.bed .no{position:absolute;top:6px;left:9px;font:800 11px ui-monospace,monospace;opacity:.7}
.bed .pt{font-size:clamp(30px,8vh,56px);line-height:1;z-index:1;transition:transform .2s}
.bed .nm{font-size:11px;font-weight:700;z-index:1;margin-top:2px;background:#fffdf6cc;border-radius:8px;padding:0 6px}
.bed.has{border-color:#ff6b35;background:#fff3e6}
.bed.has .pt{animation:bob 1s ease-in-out infinite}
.bed.urg{animation:shake .5s infinite;border-color:var(--red);background:#ffe3e5}
.bed.good .pt{transform:scale(1.2)}
.bub{position:absolute;top:6px;right:6px;width:48px;height:48px;border-radius:50%;display:none;place-items:center;z-index:2;border:3px solid var(--ink);background:conic-gradient(var(--c,#2a9d8f) calc(var(--p,100)*1%),#ddd 0)}
.bub::before{content:"";position:absolute;inset:4px;border-radius:50%;background:#fff}
.bub span{position:relative;font-size:20px}
.bed.has .bub{display:grid}
.tag{position:absolute;bottom:6px;left:0;right:0;text-align:center;z-index:2;font-size:11px;font-weight:800;color:#fff;text-shadow:0 1px 0 var(--ink),1px 0 0 var(--ink),-1px 0 0 var(--ink),0 -1px 0 var(--ink)}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes shake{25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
#call{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:none;border:3px solid var(--ink);border-radius:18px;background:var(--gold);padding:12px 20px;font-weight:900;font-size:17px;box-shadow:0 5px 0 var(--ink);z-index:6;animation:ring .35s infinite;white-space:nowrap}
#call.on{display:block}
@keyframes ring{25%{transform:translateX(-50%) rotate(-3deg)}75%{transform:translateX(-50%) rotate(3deg)}}
#toast{position:absolute;top:62px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:7px 14px;border-radius:12px;font-weight:700;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9;max-width:90%;text-align:center}
#toast.on{opacity:1}
.ov{position:absolute;inset:0;display:none;z-index:10;background:rgba(20,38,43,.72);align-items:center;justify-content:center;padding:12px;overflow:auto}
.ov.on{display:flex}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 var(--ink);padding:16px;width:min(560px,100%);max-height:100%;overflow:auto}
h1{margin:0;font:900 clamp(34px,9vw,58px)/1 ui-monospace,"Courier New",monospace;letter-spacing:.04em;color:var(--ink);text-shadow:3px 3px 0 var(--gold)}
h2{margin:10px 0 6px;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.tagline{margin:6px 0 10px;font-weight:600;font-size:14px}
.opts{display:grid;gap:8px}
.opt{border:3px solid var(--ink);border-radius:14px;background:#fff;padding:8px 12px;text-align:left;font-weight:800;box-shadow:0 3px 0 var(--ink)}
.opt small{display:block;font-weight:600;opacity:.75}
.opt.sel{background:var(--gold)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.av{font-size:30px;width:56px;height:56px;border:3px solid var(--ink);border-radius:14px;background:#fff;box-shadow:0 3px 0 var(--ink)}
.av.sel{background:var(--gold)}
.pill{border:3px solid var(--ink);border-radius:20px;background:#fff;padding:4px 14px;font-weight:800}
.pill.sel{background:var(--gold)}
.big{display:block;width:100%;border:3px solid var(--ink);border-radius:16px;background:var(--gold);padding:14px;font-weight:900;font-size:20px;letter-spacing:.06em;box-shadow:0 5px 0 var(--ink);margin-top:12px}
.big:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.small{font-size:12px;opacity:.75;margin-top:10px;text-align:center}
.howto{font-size:13px;line-height:1.45;background:#fff;border:3px dashed var(--ink);border-radius:12px;padding:8px 10px;margin-top:10px}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.mhead b{font-size:18px}
.x{border:3px solid var(--ink);background:#fff;border-radius:10px;width:36px;height:34px;font-weight:900}
.hint{margin:0 0 10px;font-weight:600;font-size:14px}
.track{position:relative;height:46px;border:3px solid var(--ink);border-radius:14px;background:#cfe0ff;overflow:hidden}
.zone{position:absolute;top:0;bottom:0;background:#52c97a;border-left:3px solid var(--ink);border-right:3px solid var(--ink)}
.mark{position:absolute;top:-3px;bottom:-3px;width:10px;margin-left:-5px;background:var(--red);border:3px solid var(--ink);border-radius:6px}
.pips{margin:8px 0;font-size:22px;letter-spacing:4px;text-align:center;min-height:30px}
.area{position:relative;height:190px;border:3px solid var(--ink);border-radius:14px;background:#ffe2cf;overflow:hidden;touch-action:none}
.vein{position:absolute;left:0;right:0;top:50%;height:22px;margin-top:-11px;background:#6c8ee0;opacity:.35}
.dot{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:3px solid var(--ink);background:#4f78e6;box-shadow:0 0 0 4px rgba(79,120,230,.3)}
.tbar{height:10px;border:2px solid var(--ink);border-radius:6px;background:#fff;margin-top:8px;overflow:hidden}.tbar i{display:block;height:100%;background:var(--red);width:100%}
.vit{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.vit div{border:3px solid var(--ink);border-radius:12px;background:#0f1f24;color:#7dffb0;text-align:center;font:800 15px ui-monospace,monospace;padding:6px 2px}
.vit small{display:block;color:#9fb3b8;font-size:10px}
.heart{width:150px;height:150px;margin:6px auto;border:4px solid var(--ink);border-radius:50%;background:#ff5a67;font-size:68px;display:grid;place-items:center;box-shadow:0 6px 0 var(--ink)}
.fb{height:24px;text-align:center;font-weight:900}
.xr{display:block;margin:0 auto 10px;width:min(230px,60vw);border:3px solid var(--ink);border-radius:12px}
.res{text-align:center;padding:14px 4px}.res .e{font-size:54px}.res b{font-size:22px;display:block;margin:4px 0}
.stars{font-size:34px;letter-spacing:4px}
.stat{display:flex;justify-content:space-between;border-bottom:2px dashed #bbb;padding:5px 0;font-weight:700}
.case{border:3px solid var(--ink);border-radius:12px;background:#0f1f24;color:#7dffb0;font:700 14px/1.4 ui-monospace,monospace;padding:10px;margin-bottom:10px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.rx{border:3px solid var(--ink);border-radius:12px;background:#fff;padding:8px;font-size:13px;font-weight:700;line-height:1.55}
.rx h4{margin:0 0 4px;font-size:11px;text-transform:uppercase;opacity:.6}
.ecg{display:block;width:100%;border:3px solid var(--ink);border-radius:12px;margin-bottom:10px;background:#0b1a1e}
.opt.ok{background:#8ce0a8}.opt.bad{background:#ff9aa2}
</style>
</head>

function beep(f=660,d=.1,type='sine',v=.07){
  if(!SAVE.snd)return;

    const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(AC.destination);o.start();
    g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.stop(AC.currentTime+d);}catch(e){}
}

/* ---------- gelung utama ---------- */
function weightedType(){
  const w=ROLEW[S.role];let tot=0;for(const k in w)tot+=w[k];let r=Math.random()*tot;
  for(const k in w){r-=w[k];if(r<=0)return k;}return 'bloods';
}
function spawn(){
  const free=S.beds.map((b,i)=>b.task?-1:i).filter(i=>i>=0);
  if(!free.length)return;
  const i=pick(free),type=weightedType(),ramp=S.el/SHIFT;
  const urgent=type==='resus';
  const pat=(urgent?20:36-11*ramp)*rnd(.9,1.1);
  S.beds[i].task={type,left:pat,pat,urgent};S.beds[i].mood='';
  if(urgent){beep(300,.25,'square',.05);}else beep(700,.06,'sine',.04);
}
function loop(ts){
  if(!S||!S.on)return;
  const dt=Math.min(.1,(ts-last)/1000);last=ts;
  if(!S.paused){
    S.el+=dt;const ramp=S.el/SHIFT;
    S.nextSpawn-=dt;
    if(S.nextSpawn<=0){spawn();S.nextSpawn=rnd(4.6,6.4)-2.8*ramp;}
    let active=0;
    S.beds.forEach((b,i)=>{
      if(b.flash>0)b.flash-=dt;
      if(!b.task)return;
      active++;
      b.task.left-=dt*((modal&&modal.bed===i)?.5:1);
      if(b.task.left<=0){
        const u=b.task.urgent;b.task=null;b.mood='😠';b.flash=1.2;
        S.missed++;S.stress+=u?18:11;toast(t('missed').replace('{n}',i+1));buzz(120);beep(150,.25,'sawtooth',.06);
        if(modal&&modal.bed===i)closeModal();
      }
    });
    S.stress+=dt*.04*active;
    // telefon
    if(!S.call&&!modal&&S.el>=S.nextCall){
      S.call={left:9,beep:0};$('#call').textContent=t('call');$('#call').classList.add('on');
    }
    if(S.call){
      S.call.left-=dt;S.call.beep-=dt;
      if(S.call.beep<=0){beep(880,.12,'square',.05);setTimeout(()=>beep(990,.12,'square',.05),180);buzz([80,60,80]);S.call.beep=1.2;}
      if(S.call.left<=0){S.call=null;$('#call').classList.remove('on');S.calls++;S.stress+=7;S.nextCall=S.el+rnd(16,26);toast(t('callIgnored'));}
    }
    S.stress=clamp(S.stress,0,100);
    if(S.stress>=100)return endShift('burn');
    if(S.el>=SHIFT)return endShift('done');
  }
  render();
  raf=requestAnimationFrame(loop);
}

function render(force){
  const m=480+S.el/SHIFT*540,h=Math.floor(m/60),mi=Math.floor(m%60);
  $('#clock').textContent=`⏰ ${String(h).padStart(2,'0')}:${String(mi).padStart(2,'0')}`;
  $('#score').textContent='⭐ '+S.score;$('#elaun').textContent='🪙 '+S.elaun;
  const bar=$('#stbar');bar.style.width=S.stress+'%';bar.style.backgroundSize=(10000/Math.max(S.stress,8))+'% 100%';
  const tea=$('#tea');tea.textContent='☕'+(S.teaLeft?S.teaLeft:'');tea.disabled=S.teaLeft<=0;
  S.beds.forEach((b,i)=>{
    const e=bedEls[i],tk=b.task;
    const face=tk?(tk.urgent?'😵':'🤒'):(b.flash>0&&b.mood?b.mood:'');
    const base=tk||b.mood?b.pt:b.pt;
    const sig=(tk?tk.type:'')+(tk&&tk.urgent?'u':'')+b.pt+(b.flash>0?b.mood:'');
    if(force||e.sig!==sig){
      e.sig=sig;e.pt.textContent=b.flash>0&&b.mood?b.mood:b.pt;e.nm.textContent=b.nm;
      e.d.classList.toggle('has',!!tk);e.d.classList.toggle('urg',!!(tk&&tk.urgent));
      e.d.classList.toggle('good',b.flash>0&&b.mood==='😊');
      if(tk){e.ico.textContent=TASKS[tk.type];e.tag.textContent=t('t_'+tk.type);}else{e.tag.textContent='';}
    }
    if(tk){const p=clamp(tk.left/tk.pat*100,0,100);e.bub.style.setProperty('--p',p);e.bub.style.setProperty('--c',p>55?'#2a9d8f':p>28?'#f4a742':'#e63946');}
  });
}

}

function openTask(i){
  if(!S||!S.on||S.paused||modal)return;
  const b=S.beds[i];if(!b.task)return;
  const type=b.task.type;
  const mg={bloods:mgBloods,cannula:mgCannula,notes:mgNotes,resus:mgResus,xray:mgXray,vitals:mgVitals,meds:mgMeds,ecg:mgEcg,
    rx:(b,d)=>mgChoice(b,d,RX,'rx_hint'),lab:(b,d)=>mgChoice(b,d,LAB,'lab_hint'),triage:(b,d)=>mgChoice(b,d,TRIAGE,'tr_hint'),plan:(b,d)=>mgChoice(b,d,PLAN,'pl_hint')}[type];
  openModal('task',i,t('t_'+type)+' · #'+(i+1)+' '+b.nm,TASKS[type],body=>mg(body,q=>finishTask(i,q,body),i));
}
function finishTask(i,q,body){
  const b=S.beds[i];if(!b.task)return;
  const tk=b.task;
  let pts=Math.round(100*q*(.6+.4*clamp(tk.left/tk.pat,0,1))*(tk.urgent?2:1));
  const ok=q>=.5;
  b.task=null;b.mood=ok?'😊':'😕';b.flash=1;
  S.done++;S.score+=pts;S.elaun+=Math.round(pts/40);
  S.stress=clamp(S.stress+(ok?-5*q-(tk.urgent?4:0):4),0,100);
  beep(ok?880:200,.2,ok?'triangle':'sawtooth');
  const lbl=q>=.9?'r3':q>=.5?'r2':q>0?'r1':'r0';
  body.innerHTML=`<div class="res"><div class="e">${ok?'✅':'😬'}</div><b>${t(lbl)}</b><div>+${pts}</div></div>`;
  setTimeout(()=>{if(modal&&modal.bed===i)closeModal();},850);
}

/* ================= MINIGAME ================= */
const R=()=>S.el/SHIFT;

function mgBloods(body,done){
  body.innerHTML=`<p class="hint">${t('bl_hint')}</p><div class="track"><div class="zone"></div><div class="mark"></div></div><div class="pips"></div><button class="big">${t('bl_btn')}</button>`;
  const zone=body.querySelector('.zone'),mark=body.querySelector('.mark'),pips=body.querySelector('.pips'),btn=body.querySelector('.big');
  const zw=Math.max(.13,.22-R()*.07),need=2,max=3;let zc,hits=0,tries=0,pos=0,dir=1,id=0,lt=performance.now(),over=false;
  const speed=.85+R()*.5;
  const setZone=()=>{zc=rnd(.2,.8);zone.style.left=((zc-zw/2)*100)+'%';zone.style.width=(zw*100)+'%';};
  const showPips=()=>{pips.textContent='💉'.repeat(0)+'●'.repeat(hits)+'○'.repeat(Math.max(0,max-tries));};
  setZone();showPips();
  const tick=n=>{const d=(n-lt)/1000;lt=n;pos+=dir*speed*d;if(pos>1){pos=1;dir=-1;}if(pos<0){pos=0;dir=1;}mark.style.left=(pos*100)+'%';id=requestAnimationFrame(tick);};
  id=requestAnimationFrame(tick);
  btn.addEventListener('pointerdown',()=>{
    if(over)return;tries++;
    if(Math.abs(pos-zc)<=zw/2){hits++;beep(900,.1,'triangle');}else beep(180,.15,'sawtooth');
    showPips();setZone();
    if(hits>=need||tries>=max){over=true;cancelAnimationFrame(id);done(hits>=need?1:hits/need*.45);}
  });
  return()=>{over=true;cancelAnimationFrame(id);};
}

function mgCannula(body,done){
  body.innerHTML=`<p class="hint">${t('ca_hint')}</p><div class="area"><div class="vein"></div><div class="dot"></div></div><div class="pips"></div><div class="tbar"><i></i></div>`;
  const area=body.querySelector('.area'),dot=body.querySelector('.dot'),pips=body.querySelector('.pips'),bar=body.querySelector('.tbar i');
  const total=9,need=3;let hits=0,id=0,over=false;const t0=performance.now();const ph=rnd(0,6),sp=1+R()*.5;
  const pos=n=>{const s=(n-t0)/1000*sp;return{x:50+38*Math.sin(s*1.4+ph),y:50+34*Math.sin(s*2.1+ph*2)};};
  const showPips=()=>{pips.textContent='●'.repeat(hits)+'○'.repeat(need-hits);};showPips();
  const tick=n=>{
    const s=(n-t0)/1000;if(s>=total){over=true;done(hits>=need?1:hits>=2?.6:hits>=1?.3:0);return;}
    const p=pos(n);dot.style.left=p.x+'%';dot.style.top=p.y+'%';bar.style.width=(100-s/total*100)+'%';id=requestAnimationFrame(tick);};
  id=requestAnimationFrame(tick);
  area.addEventListener('pointerdown',e=>{
    if(over)return;const r=area.getBoundingClientRect(),p=pos(performance.now());
    const px=e.clientX-r.left,py=e.clientY-r.top,tx=p.x/100*r.width,ty=p.y/100*r.height;
    if(Math.hypot(px-tx,py-ty)<34){hits++;beep(900,.08,'triangle');showPips();if(hits>=need){over=true;cancelAnimationFrame(id);done(1);}}
    else beep(180,.1,'sawtooth');
  });
  return()=>{over=true;cancelAnimationFrame(id);};
}

function mgNotes(body,done){
  const C={
   stable:{n:['Stabil','Stable'],bp:[[110,130],[70,85]],hr:[65,88],rr:[14,18],sp:[96,99],tp:[36.4,37]},
   hypox:{n:['Hipoksia','Hypoxia'],bp:[[110,140],[70,90]],hr:[95,115],rr:[26,34],sp:[83,89],tp:[36.6,37.4]},
   htn:{n:['Hipertensi teruk','Severe hypertension'],bp:[[185,205],[105,120]],hr:[70,95],rr:[14,18],sp:[95,99],tp:[36.4,37]},
   sepsis:{n:['Curiga sepsis','Suspected sepsis'],bp:[[80,92],[45,58]],hr:[112,135],rr:[22,28],sp:[91,95],tp:[38.5,39.6]}};
  const key=pick(Object.keys(C)),c=C[key],ri=(a)=>Math.round(rnd(a[0],a[1]));
  const v={bp:ri(c.bp[0])+'/'+ri(c.bp[1]),hr:ri(c.hr),rr:ri(c.rr),sp:ri(c.sp)+'%',tp:rnd(c.tp[0],c.tp[1]).toFixed(1)+'°'};
  body.innerHTML=`<p class="hint">${t('no_hint')}</p><div class="vit">
   <div><small>BP</small>${v.bp}</div><div><small>HR</small>${v.hr}</div><div><small>RR</small>${v.rr}</div>
   <div><small>SpO₂</small>${v.sp}</div><div><small>Temp</small>${v.tp}</div></div><div class="opts"></div>`;

function mgResus(body,done){
  body.innerHTML=`<p class="hint">${t('re_hint')}</p><div class="heart">❤️</div><div class="fb"></div><div class="pips"></div><div class="tbar"><i></i></div><button class="big">${t('re_btn')}</button>`;
  const heart=body.querySelector('.heart'),fb=body.querySelector('.fb'),pips=body.querySelector('.pips'),bar=body.querySelector('.tbar i'),btn=body.querySelector('.big');
  const period=545,goal=14,lead=900,total=17000;const start=performance.now()+lead;let good=0,id=0,over=false,lastBeat=-1;
  const showPips=()=>{pips.textContent=good+' / '+goal;};showPips();
  const tick=n=>{
    if(over)return;const el=n-start;
    if(el>=total){over=true;done(Math.min(1,good/goal));return;}
    if(el>=0){const ph=(el%period)/period;heart.style.transform=`scale(${1+.18*Math.pow(1-ph,3)})`;
      const bi=Math.floor(el/period);if(bi!==lastBeat){lastBeat=bi;beep(440,.05,'sine',.03);}
      bar.style.width=(100-el/total*100)+'%';}
    else{heart.style.transform='scale(1)';bar.style.width='100%';}
    id=requestAnimationFrame(tick);};
  id=requestAnimationFrame(tick);
  btn.addEventListener('pointerdown',()=>{
    if(over)return;const now=performance.now();if(now<start)return;
    const d=(now-start)%period,off=Math.min(d,period-d);
    if(off<=150){good++;fb.textContent=t('good');fb.style.color='#1b8a4a';beep(700,.06,'triangle');showPips();
      if(good>=goal){over=true;cancelAnimationFrame(id);done(1);}}
    else{fb.textContent=d<period/2?t('late'):t('early');fb.style.color='#c0392b';beep(160,.08,'sawtooth');}
  });
  return()=>{over=true;cancelAnimationFrame(id);};
}

function mgVitals(body,done){
  body.innerHTML=`<p class="hint">${t('vi_hint')}</p><div class="track"><div class="zone"></div><div class="mark" style="left:0"></div></div><div class="gauge" style="text-align:center;font:900 28px ui-monospace,monospace;margin:8px 0">0 mmHg</div><div class="pips"></div><button class="big">${t('vi_btn')}</button>`;
  const zone=body.querySelector('.zone'),mark=body.querySelector('.mark'),gauge=body.querySelector('.gauge'),pips=body.querySelector('.pips'),btn=body.querySelector('.big');
  const MAX=220,zw=24;let val=0,zc,pump=false,tries=0,id=0,lt=performance.now(),over=false;
  const setZone=()=>{zc=rnd(110,175);zone.style.left=((zc-zw/2)/MAX*100)+'%';zone.style.width=(zw/MAX*100)+'%';};
  setZone();
  const judge=()=>{
    if(!pump||over)return;pump=false;tries++;
    const hit=Math.abs(val-zc)<=zw/2;
    if(hit){over=true;cancelAnimationFrame(id);beep(900,.1,'triangle');done(tries===1?1:.7);return;}
    beep(180,.15,'sawtooth');
    if(tries>=2){over=true;cancelAnimationFrame(id);done(0);return;}
    pips.textContent=t('vi_miss');val=0;setZone();
  };
  const tick=n=>{const d=(n-lt)/1000;lt=n;
    if(pump){val+=78*d;if(val>=MAX){val=MAX;judge();}}
    else if(val>0&&!over){val=Math.max(0,val-120*d);}
    mark.style.left=(val/MAX*100)+'%';gauge.textContent=Math.round(val)+' mmHg';
    if(!over)id=requestAnimationFrame(tick);};
  id=requestAnimationFrame(tick);
  btn.addEventListener('pointerdown',()=>{if(over)return;pump=true;pips.textContent='';});
  const up=()=>judge();
  window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);
  return()=>{over=true;cancelAnimationFrame(id);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',up);};
}
