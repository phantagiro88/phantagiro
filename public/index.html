<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kebun Juta">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#7ad86b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Kebun Juta</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:ui-rounded,"Arial Rounded MT Bold","Nunito","Segoe UI",system-ui,sans-serif;
  background:linear-gradient(#8fe0ff 0%,#d8f6ff 28%,#b5ec8e 28%,#7ad86b 100%);
  color:#3b2a1a;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
#app{height:100dvh;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding:env(safe-area-inset-top) 0 0}

header{display:flex;align-items:center;gap:8px;padding:8px 12px 4px}
.money{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:#fff;border-radius:999px;
  padding:5px 14px;box-shadow:0 4px 0 #e0b84a,0 6px 12px #0002;border:3px solid #ffd45c;transition:transform .15s}
.money .ic{font-size:1.6rem}
.money b{font-size:1.65rem;letter-spacing:.5px;white-space:nowrap}
.money.shake{animation:shake .4s;border-color:#ff6b6b}
.money.pop{transform:scale(1.08)}
.round{flex:0 0 auto;width:46px;height:46px;border-radius:50%;background:#fff;font-size:1.4rem;font-weight:900;
  box-shadow:0 4px 0 #cfd8dc,0 6px 10px #0002;display:flex;align-items:center;justify-content:center}
.round:active{transform:translateY(3px);box-shadow:0 1px 0 #cfd8dc}
#lang{font-size:.95rem}

.goal{display:flex;align-items:center;gap:8px;padding:2px 14px 8px}
.goalbar{flex:1;height:20px;border-radius:99px;background:#fff9;border:3px solid #fff;overflow:hidden;box-shadow:inset 0 2px 4px #0002}
.goalbar i{display:block;height:100%;width:2%;background:linear-gradient(90deg,#ffd45c,#ff9f1c);border-radius:99px;transition:width .5s}
.trophy{font-weight:800;font-size:.95rem;background:#fff;border-radius:99px;padding:3px 10px;box-shadow:0 3px 0 #e0b84a}

#stage{position:relative;flex:1;min-height:0;margin:0 8px 8px;border-radius:22px;overflow:hidden;
  box-shadow:0 5px 0 #4a8f3f,0 8px 16px #0003;border:3px solid #fff}
#c{width:100%;height:100%;display:block;touch-action:none;background:#9ee6ff}
#hint{position:absolute;left:12px;right:12px;bottom:12px;margin:0 auto;width:fit-content;max-width:calc(100% - 24px);background:#fffffff0;border-radius:99px;
  padding:8px 16px;font-weight:800;color:#2f6d2a;font-size:1rem;text-align:center;box-shadow:0 4px 12px #0003;pointer-events:none;animation:hintbounce 1.2s ease-in-out infinite}
#hint[hidden]{display:none}
.rot{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:8px}
.rot .round{width:42px;height:42px;font-size:1.25rem;background:#ffffffd9}

.panel{background:#fff;border-radius:26px 26px 0 0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -6px 18px #0002}
.actions{display:flex;gap:8px;margin-bottom:8px}
.actions button{flex:1;padding:10px 6px;border-radius:14px;font-weight:800;font-size:1rem;background:#eaf7e4;box-shadow:0 4px 0 #b9dfab}
.actions button:active{transform:translateY(3px);box-shadow:0 1px 0 #b9dfab}
.shelf{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.shelf::-webkit-scrollbar{display:none}
.seed{flex:0 0 auto;width:72px;border-radius:16px;background:#f5f5f5;padding:5px 2px;text-align:center;box-shadow:0 4px 0 #cfcfcf;border:3px solid transparent}
.seed .e{font-size:1.9rem;line-height:1.1;display:block}
.seed .n{font-size:.62rem;font-weight:800;display:block;color:#6b5b4b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seed .p{font-size:.8rem;font-weight:800;display:block;color:#3b6b2f}
.seed.sel{background:#fff4c2;border-color:#ffb800;box-shadow:0 4px 0 #e0a100;transform:translateY(-3px)}
.seed.poor .p{color:#d64545}
.seed.lock{opacity:.55;filter:grayscale(.8)}
.seed.lock .p{color:#555}
.sell{display:flex;align-items:center;gap:10px}
#basket{flex:1;min-height:56px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;background:#f3ebe0;border-radius:16px;padding:6px 10px;font-size:1.25rem;font-weight:800;border:3px solid #d9c3a3}
#basket span{white-space:nowrap}
#basket.shake{animation:shake .4s}
#basket .empty{opacity:.5;font-size:1rem}
#sellBtn{padding:12px 16px;border-radius:18px;background:linear-gradient(#ffd45c,#ffa800);font-weight:900;font-size:1.1rem;box-shadow:0 5px 0 #c27d00;white-space:nowrap}
#sellBtn:active{transform:translateY(4px);box-shadow:0 1px 0 #c27d00}
#sellBtn.off{filter:grayscale(1);opacity:.5}

#toast{position:fixed;left:50%;top:22%;transform:translate(-50%,-10px);background:#fffffff2;padding:10px 20px;border-radius:99px;
  font-weight:800;font-size:1.1rem;box-shadow:0 6px 20px #0004;opacity:0;pointer-events:none;transition:.25s;z-index:60;text-align:center;max-width:90vw}
#toast.show{opacity:1;transform:translate(-50%,0)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.fl{position:fixed;font-size:1.7rem;font-weight:900;animation:rise .9s ease-out forwards;text-shadow:0 2px 3px #fff;white-space:nowrap}
.coin{position:fixed;font-size:1.8rem;transition:transform .8s cubic-bezier(.5,-0.3,.8,.5),opacity .8s}
.conf{position:fixed;top:-40px;font-size:2rem;animation:fall linear forwards}

#win{position:fixed;inset:0;background:#000a;z-index:40;display:flex;align-items:center;justify-content:center;padding:20px}
#win[hidden]{display:none}
.card{background:#fff;border-radius:28px;padding:26px 22px;text-align:center;max-width:380px;box-shadow:0 10px 40px #0006;animation:bounce .9s ease-in-out 2}
.card h1{margin:0 0 6px;font-size:2rem}
.card .big{font-size:5rem;line-height:1}
.card p{font-size:1.1rem;margin:8px 0 16px}
.card button{display:block;width:100%;margin-top:10px;padding:14px;border-radius:18px;font-weight:900;font-size:1.1rem;background:linear-gradient(#ffd45c,#ffa800);box-shadow:0 5px 0 #c27d00}
.card button.alt{background:#eaf7e4;box-shadow:0 5px 0 #b9dfab}

#shop{position:fixed;inset:0;background:#0007;z-index:50;display:flex;align-items:flex-end;justify-content:center}
#shop[hidden]{display:none}
.sheet{background:#fff;width:100%;max-width:560px;max-height:85dvh;overflow:auto;border-radius:26px 26px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom))}
.sheethead{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.sheethead h2{margin:0;font-size:1.4rem}
#rank{margin:2px 0 12px;font-size:1rem;color:#6b5b4b}
.up{display:flex;align-items:center;gap:10px;background:#f7f2ea;border-radius:18px;padding:10px;margin-bottom:10px;border:3px solid #eadcc6}
.ue{font-size:2.2rem}
.ui{flex:1;min-width:0}
.ui b{display:block;font-size:1.05rem}
.ui small{display:block;color:#6b5b4b;font-size:.85rem;margin:2px 0}
.pips{font-size:.7rem;letter-spacing:1px;color:#e0a100}
.buy{padding:10px 12px;border-radius:14px;font-weight:900;background:linear-gradient(#ffd45c,#ffa800);box-shadow:0 4px 0 #c27d00;white-space:nowrap}
.buy.poor{filter:grayscale(1);opacity:.55}
.buy:disabled{background:#cfd8dc;box-shadow:0 4px 0 #9aa5ab;opacity:1;filter:none}
.reset{display:block;margin:10px auto 0;padding:10px 16px;border-radius:14px;background:#fdecea;font-weight:800;color:#b71c1c}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes hintbounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.card{animation-name:cardbounce}
@keyframes cardbounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes rise{from{transform:translateY(0);opacity:1}to{transform:translateY(-70px);opacity:0}}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@media (prefers-reduced-motion:reduce){#hint{animation:none}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="money" id="money"><span class="ic">💰</span><b id="moneyTxt">$0</b></div>
    <button class="round" id="shopBtn" aria-label="Shop">🛒</button>
    <button class="round" id="lang" aria-label="Language">BM</button>
    <button class="round" id="snd" aria-label="Sound">🔊</button>
  </header>
  <div class="goal"><div class="goalbar"><i id="goalFill"></i></div><span class="trophy" id="trophy">🏆 $1M</span></div>
  <main id="stage">
    <canvas id="c"></canvas>
    <div class="rot">
      <button class="round" id="rotL" aria-label="Rotate left">↺</button>
      <button class="round" id="rotR" aria-label="Rotate right">↻</button>
    </div>
    <div id="hint" data-i18n="hint"></div>
  </main>
  <section class="panel">
    <div class="actions">
      <button id="plantAll" data-i18n="plantAll"></button>
      <button id="harvestAll" data-i18n="harvestAll"></button>
    </div>
    <div class="shelf" id="shelf"></div>
    <div class="sell">
      <div id="basket"></div>
      <button id="sellBtn"><span data-i18n="sell"></span> <span id="sellVal">$0</span></button>
    </div>
  </section>
</div>
<div id="toast"></div>
<div id="fx"></div>
<div id="win" hidden>
  <div class="card">
    <div class="big">🏆</div>
    <h1 data-i18n="winTitle"></h1>
    <p id="winText"></p>
    <button id="keepPlaying" data-i18n="keep"></button>
  </div>
</div>
<div id="shop" hidden>
  <div class="sheet">
    <div class="sheethead"><h2 data-i18n="shopTitle"></h2><button class="round" id="shopClose" aria-label="Close">✕</button></div>
    <div id="rank"></div>
    <div id="ups"></div>
    <button class="reset" id="reset"></button>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
